[package]
name = "trionchain-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
# --- RPC runtime APIs ---
frame-system-rpc-runtime-api = { path = "../deps/polkadot-sdk/substrate/frame/system/rpc/runtime-api", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { path = "../deps/polkadot-sdk/substrate/frame/transaction-payment/rpc/runtime-api", default-features = false }
# --- FORCE getrandom backends for WASM builds (needed by wasm-builder temp project) ---


# --- session keys ---
sp-session = { path = "../deps/polkadot-sdk/substrate/primitives/session", default-features = false }

# --- runtime APIs you used ---
sp-block-builder = { path = "../deps/polkadot-sdk/substrate/primitives/block-builder", default-features = false }
sp-transaction-pool = { path = "../deps/polkadot-sdk/substrate/primitives/transaction-pool", default-features = false }
sp-offchain = { path = "../deps/polkadot-sdk/substrate/primitives/offchain", default-features = false }

# --- consensus pallets ---
pallet-aura = { path = "../deps/polkadot-sdk/substrate/frame/aura", default-features = false }
pallet-grandpa = { path = "../deps/polkadot-sdk/substrate/frame/grandpa", default-features = false }

# ✅ IMPORTANT: genesis-builder MUST be present in wasm (no optional)
sp-genesis-builder = { path = "../deps/polkadot-sdk/substrate/primitives/genesis-builder", default-features = false }

# ✅ IMPORTANT: we need serde_json in wasm too (no optional)
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# optional dev helper (std)
sp-keyring = { path = "../deps/polkadot-sdk/substrate/primitives/keyring", default-features = true, optional = true }

# --- workspace runtime deps ---
codec = { workspace = true }
scale-info = { workspace = true }
serde = { workspace = true }

sp-api = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-version = { workspace = true }
sp-storage = { workspace = true }

frame-support = { workspace = true }
frame-system = { workspace = true }
frame-executive = { workspace = true }

pallet-balances = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-sudo = { workspace = true }
pallet-transaction-payment = { workspace = true }

sp-consensus-aura = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-inherents = { workspace = true }

[features]
default = ["std"]

std = [
  "serde/std",
  "codec/std",
  "scale-info/std",

  "sp-api/std",
  "sp-core/std",
  "sp-io/std",
  "sp-runtime/std",
  "sp-std/std",
  "sp-version/std",
  "sp-storage/std",

  "frame-support/std",
  "frame-system/std",
  "frame-executive/std",

  "pallet-balances/std",
  "pallet-timestamp/std",
  "pallet-sudo/std",
  "pallet-transaction-payment/std",

  "pallet-aura/std",
  "pallet-grandpa/std",

  "sp-consensus-aura/std",
  "sp-consensus-grandpa/std",
  "sp-inherents/std",

  "sp-block-builder/std",
  "sp-transaction-pool/std",
  "sp-offchain/std",

  "frame-system-rpc-runtime-api/std",
  "pallet-transaction-payment-rpc-runtime-api/std",
  "sp-session/std",
  "sp-keyring",


  "sp-genesis-builder/std",
  "serde_json/std",
]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2.17", default-features = false, features = ["js"] }

[build-dependencies]
substrate-wasm-builder = { workspace = true }
