[package]
name = "trionchain-node"
version = "4.0.0-dev"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# local runtime
trionchain-runtime = { path = "../runtime" }

# --- Substrate client (node) ---
sc-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-service = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-executor = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-network = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-rpc = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-rpc-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-basic-authorship = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }

# --- primitives (node side, std ok) ---
sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }

# --- FRAME (std for node) ---
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
frame-system  = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }

[build-dependencies]
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
