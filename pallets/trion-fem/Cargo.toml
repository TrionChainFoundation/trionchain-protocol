[package]
name = "pallet-trion-fem"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
parity-scale-codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }

frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-system  = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-benchmarking = { workspace = true, default-features = false, optional = true }

sp-std = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

[dev-dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }

[features]
default = ["std"]

std = [
  "parity-scale-codec/std",
  "scale-info/std",
  "frame-support/std",
  "frame-system/std",
  "sp-std/std",
]

runtime-benchmarks = [
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
]

try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
]