[workspace]
resolver = "2"
members = [
  "node",
  "runtime",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "1.0.0"
authors = ["TrionChain <dev@trionchain.org>"]
homepage = "https://trionchain.org"
repository = "https://github.com/trionchain"
description = "TrionChain node & runtime workspace"

# Algunos crates del SDK (por path) heredan lints del workspace
[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = "allow"

[workspace.dependencies]
# --- SCALE / Serde (NO-STD para runtime/wasm) ---
substrate-wasm-builder = { path = "deps/polkadot-sdk/substrate/utils/wasm-builder" }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive","alloc"] }

# --- Substrate primitives (PATH) ---
sp-api = { path = "deps/polkadot-sdk/substrate/primitives/api", default-features = false }
sp-core = { path = "deps/polkadot-sdk/substrate/primitives/core", default-features = false }
sp-io = { path = "deps/polkadot-sdk/substrate/primitives/io", default-features = false }
sp-runtime = { path = "deps/polkadot-sdk/substrate/primitives/runtime", default-features = false }
sp-std = { path = "deps/polkadot-sdk/substrate/primitives/std", default-features = false }
sp-version = { path = "deps/polkadot-sdk/substrate/primitives/version", default-features = false }
sp-storage = { path = "deps/polkadot-sdk/substrate/primitives/storage", default-features = false }
sp-externalities = { path = "deps/polkadot-sdk/substrate/primitives/externalities", default-features = false }
sp-keystore = { path = "deps/polkadot-sdk/substrate/primitives/keystore" }
sp-keyring = { path = "deps/polkadot-sdk/substrate/primitives/keyring" }

sp-consensus = { path = "deps/polkadot-sdk/substrate/primitives/consensus/common", default-features = false }
sp-consensus-aura = { path = "deps/polkadot-sdk/substrate/primitives/consensus/aura", default-features = false }
sp-consensus-grandpa = { path = "deps/polkadot-sdk/substrate/primitives/consensus/grandpa", default-features = false }
sp-block-builder = { path = "deps/polkadot-sdk/substrate/primitives/block-builder", default-features = false }
sp-inherents = { path = "deps/polkadot-sdk/substrate/primitives/inherents", default-features = false }
sp-transaction-pool = { path = "deps/polkadot-sdk/substrate/primitives/transaction-pool", default-features = false }

# --- FRAME (PATH) ---
frame-support = { path = "deps/polkadot-sdk/substrate/frame/support", default-features = false }
frame-system = { path = "deps/polkadot-sdk/substrate/frame/system", default-features = false }
frame-executive = { path = "deps/polkadot-sdk/substrate/frame/executive", default-features = false }

pallet-balances = { path = "deps/polkadot-sdk/substrate/frame/balances", default-features = false }
pallet-timestamp = { path = "deps/polkadot-sdk/substrate/frame/timestamp", default-features = false }
pallet-sudo = { path = "deps/polkadot-sdk/substrate/frame/sudo", default-features = false }
pallet-transaction-payment = { path = "deps/polkadot-sdk/substrate/frame/transaction-payment", default-features = false }

# --- Substrate client (PATH) ---
sc-cli = { path = "deps/polkadot-sdk/substrate/client/cli" }
sc-service = { path = "deps/polkadot-sdk/substrate/client/service" }
sc-executor = { path = "deps/polkadot-sdk/substrate/client/executor" }
sc-client-api = { path = "deps/polkadot-sdk/substrate/client/api" }
sc-telemetry = { path = "deps/polkadot-sdk/substrate/client/telemetry" }
sc-network = { path = "deps/polkadot-sdk/substrate/client/network" }
sc-transaction-pool = { path = "deps/polkadot-sdk/substrate/client/transaction-pool" }
sc-consensus = { path = "deps/polkadot-sdk/substrate/client/consensus/common" }
sc-consensus-aura = { path = "deps/polkadot-sdk/substrate/client/consensus/aura" }
sc-consensus-grandpa = { path = "deps/polkadot-sdk/substrate/client/consensus/grandpa" }
sc-rpc = { path = "deps/polkadot-sdk/substrate/client/rpc" }
sc-rpc-api = { path = "deps/polkadot-sdk/substrate/client/rpc-api" }
sc-basic-authorship = { path = "deps/polkadot-sdk/substrate/client/basic-authorship" }

# --- Patches (para deps que se rompen en ring-vrf) ---
# Si ya no los necesitas más adelante, los quitamos, pero así evitamos “no matching package named …”
[patch."https://github.com/w3f/fflonk"]
fflonk = { git = "https://github.com/clearloop/fflonk", rev = "1e854f35e9a65d08b11a86291405cdc95baa0a35" }

[patch."https://github.com/w3f/ring-proof"]
ring = { version = "=0.17.8" }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "unwind"




