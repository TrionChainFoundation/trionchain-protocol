[workspace]
members = [
  "node",
  "runtime",
  "pallets/trion-fem",
]

resolver = "2"

[workspace.dependencies]
# --- Substrate / Polkadot SDK (stable2512) ---
sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-system  = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-sudo = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

# Codecs
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
