[workspace]
members = [
  "node",
  "runtime",
  "pallets/trion-fem",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
authors = ["TrionChain <dev@trionchain.org>"]
homepage = "https://trionchain.org"
repository = "https://github.com/trionchain/trionchain"
edition = "2021"
version = "0.1.0"
rust-version = "1.75"

# Requerido porque node/runtime tienen: [lints] workspace = true
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
# ---------------- Local crates ----------------
# El node del template usa "solochain-template-runtime"
solochain-template-runtime = { path = "runtime" }

# Tu pallet local
pallet-trion-fem = { path = "pallets/trion-fem", default-features = false }

# ---------------- Utils ----------------
clap = { version = "4.5", features = ["derive"] }
futures = { version = "0.3", features = ["thread-pool"] }
jsonrpsee = { version = "0.24" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
jsonrpsee-core = { version = "0.24" }
jsonrpsee-types = { version = "0.24" }

# ---------------- Codecs ----------------
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive", "serde"] }
# Alias requerido por Substrate templates
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }

# ---------------- Polkadot SDK (stable2512) ----------------
# SP
sp-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false, features = ["serde"] }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false, features = ["serde"] }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false, features = ["serde"] }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false, features = ["serde"] }
sp-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false, features = ["serde"] }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-keyring = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-timestamp = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-session = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-storage = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
sp-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

# FRAME
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false, features = ["experimental"] }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-system-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-system-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
frame-try-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

getrandom = { version = "0.2", default-features = false, features = ["custom"] }

# Pallets
pallet-aura = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-sudo = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-transaction-payment-rpc = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }

# Client / Node
sc-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-service = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-executor = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-network = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-network-types = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-offchain = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-consensus-grandpa = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-basic-authorship = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-transaction-pool-api = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }

# RPC + build utils
substrate-frame-rpc-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
substrate-build-script-utils = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
frame-benchmarking-cli = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512" }
frame-metadata-hash-extension = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2512", default-features = false }


